  <text x="52" y="160" font-family="ui-sans-serif, system-ui" font-size="13" fill="#111">• Private-by-default reflections</text>
  <text x="52" y="190" font-family="ui-sans-serif, system-ui" font-size="13" fill="#111">• No blame / no scorekeeping</text>
  <text x="52" y="220" font-family="ui-sans-serif, system-ui" font-size="13" fill="#111">• Two perspectives = data</text>
  <text x="52" y="250" font-family="ui-sans-serif, system-ui" font-size="13" fill="#111">• Small actions win (1 week)</text>
  <text x="52" y="280" font-family="ui-sans-serif, system-ui" font-size="13" fill="#111">• Coaching tool, not therapy</text>
