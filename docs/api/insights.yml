openapi: 3.0.0
info:
  title: Triangle of Love - Insights API
  version: 1.0.0

paths:
  /api/v1/insights:
    get:
      summary: Return insight scores for the authenticated account
      description: |
        When `past` is absent: returns 7 day objects, oldest-first (index 0 = 6 days ago,
        index 6 = yesterday). Backward-compatible default.
        When `past` is provided: returns N day objects, oldest-first (index 0 = N-1 days ago,
        index N-1 = today). Window is anchored at today UTC.
        A score of -1 means no check-in exists for that day/dimension.
        Valid range for `past`: 1–100. Out-of-range or non-integer values return 400.
      security:
        - bearerAuth: []
      parameters:
        - name: past
          in: query
          required: false
          description: |
            Number of days to include in the window (1–100).
            Omit to use the default 7-day window ending yesterday.
            When provided, the window ends at today (index N-1 = today).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 31
      responses:
        "200":
          description: Insight scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyDayInsight"
                minItems: 1
                maxItems: 100
        "400":
          description: Invalid `past` parameter (out of range or non-integer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/insights/{date}:
    get:
      summary: Return daily insight scores for the authenticated account on a given date
      description: |
        Scores are normalized to 0-100.
        A score of -1 means both proxy metrics for that dimension were unset (0)
        in the check-in, so the dimension is unavailable.
        The requested date is implied by the path parameter and is not repeated
        in the response body.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          description: Calendar date in YYYYMMDD format (UTC)
          schema:
            type: string
            pattern: '^\\d{8}$'
            example: "20260417"
      responses:
        "200":
          description: Daily insight scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyInsight"
        "400":
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No check-in found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DailyInsight:
      type: object
      required:
        - intimacy
        - commitment
        - passion
      properties:
        intimacy:
          type: integer
          description: 0-100, or -1 if both proxy metrics were unset.
          example: 75
        commitment:
          type: integer
          description: 0-100, or -1 if both proxy metrics were unset.
          example: 50
        passion:
          type: integer
          description: 0-100, or -1 if both proxy metrics were unset.
          example: -1
    WeeklyDayInsight:
      type: object
      required:
        - date
        - intimacy
        - commitment
        - passion
      properties:
        date:
          type: string
          description: Calendar date in YYYYMMDD format (UTC)
          example: "20260421"
        intimacy:
          type: integer
          description: 0-100, or -1 if no check-in exists for this day.
          example: 75
        commitment:
          type: integer
          description: 0-100, or -1 if no check-in exists for this day.
          example: 50
        passion:
          type: integer
          description: 0-100, or -1 if no check-in exists for this day.
          example: -1
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: invalid date format
