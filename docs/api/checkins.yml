openapi: 3.0.0
info:
  title: Triangle of Love — Session API
  version: 1.0.0

paths:
  /api/v1/sessions/today:
    get:
      summary: Return today's session for the authenticated account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Today's session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No session exists for today yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Create or update today's session for the authenticated account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionBody'
      responses:
        '200':
          description: Saved session (upserted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SessionBody:
      type: object
      required:
        - note
      properties:
        felt_understood:
          type: integer
          minimum: 0
          maximum: 5
          description: Rating 1–5, or 0 if not yet set.
          example: 4
        meaningful_sharing:
          type: integer
          minimum: 0
          maximum: 5
          description: Rating 1–5, or 0 if not yet set.
          example: 3
        could_count_on_them:
          type: integer
          minimum: 0
          maximum: 5
          description: Rating 1–5, or 0 if not yet set.
          example: 5
        effort_for_us:
          type: integer
          minimum: 0
          maximum: 5
          description: Rating 1–5, or 0 if not yet set.
          example: 4
        desire:
          type: integer
          minimum: 0
          maximum: 5
          description: Rating 1–5, or 0 if not yet set.
          example: 3
        spark:
          type: integer
          minimum: 0
          maximum: 5
          description: Rating 1–5, or 0 if not yet set.
          example: 4
        mood:
          type: integer
          minimum: 0
          maximum: 5
          description: Personal mood rating 1–5, or 0 if not yet set.
          example: 4
        note:
          type: string
          description: Optional free-text note; empty string when not entered
          example: "Felt really connected today."
    Session:
      allOf:
        - $ref: '#/components/schemas/SessionBody'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            account_id:
              type: string
              format: uuid
            date:
              type: string
              format: date
              description: UTC calendar date of the session
              example: "2026-03-31"
            saved_at:
              type: string
              format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
