services:
  frontend:
    image: ${FRONTEND_IMAGE:-triangleoflove-frontend:local}
    build:
      context: ./frontend
    container_name: triangleoflove-frontend
    ports:
      - "5173"

  backend:
    image: ${BACKEND_IMAGE:-triangleoflove-backend:local}
    build:
      context: ./backend
    container_name: triangleoflove-backend
    ports:
      - "8080"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=triangleoflove
      - POSTGRES_USER=triangle
      - POSTGRES_PASSWORD=triangle
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ${DB_IMAGE:-triangleoflove-db:local}
    build:
      context: ./db
    container_name: triangleoflove-db
    environment:
      - POSTGRES_DB=triangleoflove
      - POSTGRES_USER=triangle
      - POSTGRES_PASSWORD=triangle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triangle -d triangleoflove"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  api-tests:
    image: ${API_TESTS_IMAGE:-triangleoflove-api-tests:local}
    build:
      context: ./api-tests
    container_name: triangleoflove-api-tests
    environment:
      - API_BASE_URL=http://backend:8080
      - FRONTEND_BASE_URL=http://frontend:5173
    depends_on:
      - backend
      - frontend
    profiles:
      - tests
