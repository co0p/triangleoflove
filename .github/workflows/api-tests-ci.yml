name: API Tests CI

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-tests-quality:
    name: API Tests Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -d api-tests
          test -f api-tests/Dockerfile
          test -f docker-compose.yml

      - name: Run dockerized API acceptance tests (source)
        run: |
          docker compose --profile tests up --build --abort-on-container-exit --exit-code-from api-tests api-tests

      - name: Print source stack logs on failure
        if: failure()
        run: |
          docker compose --profile tests logs backend db || true

      - name: Tear down source stack
        if: always()
        run: docker compose --profile tests down -v

  api-tests-image:
    name: API Tests Image
    runs-on: ubuntu-latest
    needs: api-tests-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish api-tests image
        uses: docker/build-push-action@v6
        with:
          context: ./api-tests
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/triangleoflove-api-tests:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/triangleoflove-api-tests:latest

  ghcr-integration:
    name: API Tests Against GHCR Images
    runs-on: ubuntu-latest
    needs: api-tests-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DB_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-db:${{ github.sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-backend:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-frontend:${{ github.sha }}
      API_TESTS_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-api-tests:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start services from GHCR images
        run: |
          docker compose --profile tests up --pull always --no-build --abort-on-container-exit --exit-code-from api-tests api-tests

      - name: Print GHCR stack logs on failure
        if: failure()
        run: |
          docker compose --profile tests logs backend db || true

      - name: Tear down GHCR test stack
        if: always()
        run: docker compose --profile tests down -v
