name: API Tests CI

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      run_ghcr_integration:
        description: "Whether GHCR-based integration test stage should run"
        required: true
        type: boolean

jobs:
  ghcr-integration:
    name: API Tests Against GHCR Images
    runs-on: ubuntu-latest
    if: inputs.run_ghcr_integration
    env:
      DB_IMAGE: triangleoflove-db:ci
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-backend:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-frontend:${{ github.sha }}
      API_TESTS_IMAGE: triangleoflove-api-tests:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -d testing
          test -f testing/Dockerfile
          test -f docker-compose.yml
          test -f services/db/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local db image
        run: docker build -t triangleoflove-db:ci ./services/db

      - name: Build local api-tests image
        run: docker build -t triangleoflove-api-tests:ci ./testing

      - name: Start services from GHCR images
        run: |
          docker compose --profile tests up --pull always --no-build --abort-on-container-exit --exit-code-from api-tests api-tests

      - name: Print GHCR stack logs on failure
        if: failure()
        run: |
          docker compose --profile tests logs backend db || true

      - name: Tear down GHCR test stack
        if: always()
        run: docker compose --profile tests down -v
