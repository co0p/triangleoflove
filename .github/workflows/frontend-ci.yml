name: Frontend CI

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      publish_images:
        description: "Whether images should be pushed to GHCR"
        required: true
        type: boolean

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm --prefix services/frontend install

      - name: Build frontend bundle
        run: npm --prefix services/frontend run build

  frontend-image:
    name: Frontend Image
    runs-on: ubuntu-latest
    needs: frontend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/triangleoflove-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Triangle of Love frontend service

      - name: Build and optionally publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          push: ${{ inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
