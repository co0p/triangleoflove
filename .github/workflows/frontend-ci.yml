name: Frontend CI

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      publish_images:
        description: "Whether images should be pushed to GHCR"
        required: true
        type: boolean

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Build frontend bundle
        run: npm --prefix frontend run build

  frontend-image:
    name: Frontend Image
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ inputs.publish_images }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/triangleoflove-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/triangleoflove-frontend:latest
