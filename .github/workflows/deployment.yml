name: Deployment

permissions:
  contents: read
  packages: read

on:
  workflow_call:

jobs:
  deploy-services:
    name: Deploy Services
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-backend:latest
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/triangleoflove-frontend:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway auth inputs
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "Missing Railway auth secret. Set RAILWAY_TOKEN."
            exit 1
          fi

          if [ -z "${RAILWAY_ENVIRONMENT:-}" ]; then
            echo "RAILWAY_ENVIRONMENT is empty. Set vars.RAILWAY_ENVIRONMENT or rely on workflow fallback."
            exit 1
          fi

      - name: Confirm deployment model
        run: |
          echo "## Deployment Model" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow triggers Railway to redeploy image-backed services." >> "$GITHUB_STEP_SUMMARY"
          echo "Railway must be configured to pull the following GHCR images:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| triangleoflove-backend | \`${BACKEND_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| triangleoflove-frontend | \`${FRONTEND_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${{ github.sha }}\` images were published to GHCR by the CI pipeline." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Redeploy backend service
        id: backend_deploy
        continue-on-error: true
        run: |
          railway redeploy \
            --yes \
            --service "triangleoflove-backend"

      - name: Redeploy frontend service
        id: frontend_deploy
        continue-on-error: true
        run: |
          railway redeploy \
            --yes \
            --service "triangleoflove-frontend"

      - name: Summarize deployment results
        if: always()
        run: |
          echo "## Railway Redeploy Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| triangleoflove-backend | ${{ steps.backend_deploy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| triangleoflove-frontend | ${{ steps.frontend_deploy.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Railway services must be configured as image-backed services." >> "$GITHUB_STEP_SUMMARY"
          echo "> See [docs/DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/main/docs/DEPLOYMENT.md) for setup instructions." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce deploy outcome
        if: always()
        run: |
          failed=""
          if [ "${{ steps.backend_deploy.outcome }}" != "success" ]; then
            failed="backend"
          fi

          if [ "${{ steps.frontend_deploy.outcome }}" != "success" ]; then
            if [ -n "$failed" ]; then
              failed="$failed, frontend"
            else
              failed="frontend"
            fi
          fi

          if [ -n "$failed" ]; then
            echo "Deployment failed for service(s): $failed"
            echo "Ensure Railway services are configured as image-backed services pointing at GHCR."
            echo "See docs/DEPLOYMENT.md for setup instructions."
            exit 1
          fi

          echo "Deployment succeeded for backend and frontend."
