name: Deployment

permissions:
  contents: read
  packages: read

on:
  workflow_call:

jobs:
  deploy-services:
    name: Deploy Services
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway auth inputs
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "Missing Railway auth secret. Set RAILWAY_TOKEN."
            exit 1
          fi

          if [ -z "${RAILWAY_ENVIRONMENT:-}" ]; then
            echo "RAILWAY_ENVIRONMENT is empty. Set vars.RAILWAY_ENVIRONMENT or rely on workflow fallback."
            exit 1
          fi

      - name: Redeploy backend service from Railway source
        id: backend_deploy
        continue-on-error: true
        run: |
          railway redeploy \
            --yes \
            --service "triangleoflove-backend" \
            --environment "$RAILWAY_ENVIRONMENT"

      - name: Redeploy frontend service from Railway source
        id: frontend_deploy
        continue-on-error: true
        run: |
          railway redeploy \
            --yes \
            --service "triangleoflove-frontend" \
            --environment "$RAILWAY_ENVIRONMENT"

      - name: Summarize deployment results
        if: always()
        run: |
          echo "## Railway Deploy Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: ${{ steps.backend_deploy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ steps.frontend_deploy.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce deploy outcome
        if: always()
        run: |
          failed=""
          if [ "${{ steps.backend_deploy.outcome }}" != "success" ]; then
            failed="backend"
          fi

          if [ "${{ steps.frontend_deploy.outcome }}" != "success" ]; then
            if [ -n "$failed" ]; then
              failed="$failed, frontend"
            else
              failed="frontend"
            fi
          fi

          if [ -n "$failed" ]; then
            echo "Deployment failed for service(s): $failed"
            exit 1
          fi

          echo "Deployment succeeded for backend and frontend."
