name: CI Orchestrator

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Pipeline
    uses: ./.github/workflows/frontend-ci.yml
    with:
      publish_images: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    secrets: inherit

  backend:
    name: Backend Pipeline
    uses: ./.github/workflows/backend-ci.yml
    with:
      publish_images: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    secrets: inherit

  db:
    name: DB Pipeline
    uses: ./.github/workflows/db-ci.yml
    with:
      publish_images: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    secrets: inherit

  api-tests:
    name: API Tests Pipeline
    needs:
      - frontend
      - backend
      - db
    uses: ./.github/workflows/api-tests-ci.yml
    with:
      run_ghcr_integration: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit

  # db is not deployed here — Railway manages the production Postgres instance directly.
  # See docs/adr/2026-03-27-railway-deployment-target.md
  deployment:
    name: Deployment Pipeline
    needs:
      - api-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
