name: DB CI

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  db-quality:
    name: DB Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate db service Dockerfile
        run: |
          test -d db
          test -f db/Dockerfile

      - name: Validate compose file
        run: docker compose config >/dev/null

  db-image:
    name: DB Image
    runs-on: ubuntu-latest
    needs: db-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish db image
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/triangleoflove-db:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/triangleoflove-db:latest
