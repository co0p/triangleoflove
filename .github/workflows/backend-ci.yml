name: Backend CI

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      publish_images:
        description: "Whether images should be pushed to GHCR"
        required: true
        type: boolean

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backend tests
        run: |
          cd services/backend
          go test ./...

      - name: Verify backend formatting
        run: |
          unformatted=$(gofmt -l services/backend)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/triangleoflove-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Triangle of Love backend service

      - name: Build and optionally publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          push: ${{ inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
